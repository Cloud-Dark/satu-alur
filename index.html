<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satu Alur — Operasi jasa dalam satu alur, ditenagai AI</title>
    <meta name="description" content="Satu Alur menyatukan permintaan, penawaran AI, penugasan, penyelesaian, pembukuan, dan laporan bisnis jasa Anda dalam satu alur kerja." />
    <meta name="theme-color" content="#f7f4ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <style>
      body { margin:0; background:#f7f4ee; color:#16241f; font-family:'Plus Jakarta Sans', ui-sans-serif, sans-serif; }
      :root[data-theme='dark'] body { background:#0b1310; color:#e9efeb; }
      noscript { display:block; padding:40px; text-align:center; }
      #app { min-height:100vh; }
    </style>
  </head>
  <body>
    <noscript>
      <h1>Satu Alur</h1>
      <p>JavaScript diperlukan untuk menjalankan aplikasi ini. Mohon aktifkan JavaScript di browser Anda.</p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
